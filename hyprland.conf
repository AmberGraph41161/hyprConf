# See https://wiki.hyprland.org/Configuring/Keywords/ for more
autogenerated = 0

### STARTUP APPLICATIONS ###
exec-once = waybar
exec-once = awww-daemon
exec-once = wl-paste --watch cliphist store
exec-once = dunst
exec-once = hypridle
exec-once = nm-applet

exec-once = systemctl --user start hyprpolkitagent
#exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# exec-once = eval $(/usr/bin/gnome-keyring-daemon --start --components=secrets,ssh)
# exec-once = eval $(/usr/bin/gnome-keyring-daemon --start --components=secrets)

exec-once = "$HOME/.config/hypr/scripts/powerprofilesctlsetcorrectpowerprofile.zsh"

### SOURCE EVERYTHING ELSE IDK ###
source = ~/.config/hypr/hyprconf/variables.conf
source = ~/.config/hypr/hyprconf/monitors.conf
source = ~/.config/hypr/hyprconf/keybinds.conf
source = ~/.config/hypr/hyprconf/workspaces.conf
source = ~/.config/hypr/hyprconf/windowrules.conf
