# See https://wiki.hyprland.org/Configuring/Binds/
#l -> locked, will also work when an input inhibitor (e.g. a lockscreen) is active.
#r -> release, will trigger on release of a key.
#o -> longPress, will trigger on long press of a key.
#e -> repeat, will repeat when held.
#n -> non-consuming, key/mouse events will be passed to the active window in addition to triggering the dispatcher.
#m -> mouse, see below.
#t -> transparent, cannot be shadowed by other binds.
#i -> ignore mods, will ignore modifiers.
#s -> separate, will arbitrarily combine keys between each mod/key, see [Keysym combos](#keysym-combos) above.
#d -> has description, will allow you to write a description for your bind.
#p -> bypasses the app's requests to inhibit keybinds.

### UTILITIES ###
# binaries
	bind = SUPER, return, exec, alacritty
	bind = SUPER SHIFT, return, exec, kitty
	bind = SUPER, E, exec, dolphin

	bindr = SUPER, Escape, exec, "$HOME/.config/hypr/scripts/powermenu.zsh"
	bindr = SUPER, O, exec, "$HOME/.config/hypr/scripts/powermenu.zsh"
	bindr = SUPER, I, exec, fuzzel
	bindr = SUPER, code:22, exec, fuzzel -p"[categories] > " --fields=name,filename,generic,exec,categories,keywords,comment #SUPER + backspace

	bindr = SUPER, X, exec, killall fuzzel grim slurp #cuz fullscreen shenanigans
	bind = SUPER SHIFT ALT, L, exec, pamixer --sink @DEFAULT_SINK@ --mute; mpc pause; hyprlock --grace 0 --immediate-render --no-fade-in #lock screen

# date, battery, active window, mpd active song, clear notifications
	binde = SUPER, Z, exec, notify-send "date" "$(date '+%A, %B %d, %Y, %T %Z')" -u normal -t 1000 -r 100000000
	binde = SUPER SHIFT, Z, exec, "$HOME/.config/hypr/scripts/batterystatusnotificationsend.zsh"
	binde = SUPER, code:61, exec, "$HOME/.config/hypr/scripts/hypractivewindownotificationsend.zsh"
	binde = SUPER SHIFT, code:61, exec, "$HOME/.config/hypr/scripts/mpdactivesongnotificationsend.zsh"
	binde = SUPER, code:51, exec, dunstctl close-all

# screenshots grim slurp
	bind = , code:107, exec, pidof slurp || grim -g "$(slurp -w 0 -b 555555aa)" -t png - | wl-copy #printscreen button
	bind = SUPER, code:107, exec, "$HOME/.config/hypr/scripts/grimmagic.zsh"
	bind = SUPER SHIFT, code:107, exec, "$HOME/.config/hypr/scripts/grimfocusedmonitor.zsh"

# brightness
	bindr = , code:232, exec, brightnessctl s 10%- #LAPTOP brightness down
	bindr = , code:233, exec, brightnessctl s +10% #LAPTOP brightness up
	bindr = CONTROL, code:232, exec, brightnessctl s 50%- #LAPTOP fast brightness down
	bindr = CONTROL, code:233, exec, brightnessctl s +50% #LAPTOP fast brightness up
	bindr = SHIFT, code:232, exec, brightnessctl s 1- #LAPTOP fine brightness down
	bindr = SHIFT, code:233, exec, brightnessctl s +1 #LAPTOP fine brightness up

# volume and mic
	$volumestatusnotificationscript = "$HOME/.config/hypr/scripts/dunstvolumestatusnotificationsend.zsh"
	bindl = , code:256, exec, pamixer --default-source -t; $volumestatusnotificationscript #LAPTOP mic mute
	bindl = , code:121, exec, pamixer --sink @DEFAULT_SINK@ -t; $volumestatusnotificationscript #BOTH mute
	bindle = , code:122, exec, pamixer --sink @DEFAULT_SINK@ -d 5; $volumestatusnotificationscript #BOTH volume decrease
	bindle = , code:123, exec, pamixer --sink @DEFAULT_SINK@ -i 5; $volumestatusnotificationscript #BOTH volume increase
	bindle = SHIFT, code:122, exec, pamixer --sink @DEFAULT_SINK@ -d 1; $volumestatusnotificationscript #LAPTOP volume decrease
	bindle = SHIFT, code:123, exec, pamixer --sink @DEFAULT_SINK@ -i 1; $volumestatusnotificationscript #LAPTOP volume increase
	bindle = CONTROL, code:122, exec, pamixer --default-source -d 1; $volumestatusnotificationscript #LAPTOP mic decrease
	bindle = CONTROL, code:123, exec, pamixer --default-source -i 1; $volumestatusnotificationscript #LAPTOP mic increase

# mpd mpc ncmpcpp
	bindl = SUPER, code:122, exec, mpc toggle #LAPTOP mpc pause/play (SUPER + VOLUME DOWN)
	bindl = SUPER, code:123, exec, mpc next; "$HOME/.config/ncmpcpp/coverart/imv_cover_art.zsh" #LAPTOP mpc next (SUPER + VOLUME UP)
	bindl = SUPER, code:121, exec, mpc prev; "$HOME/.config/ncmpcpp/coverart/imv_cover_art.zsh" #LAPTOP mpc previous (SUPER + VOLUME MUTE)

	bindl = , code:172, exec, mpc toggle #KEYBOARD mpc pause/play
	bindl = , code:171, exec, mpc next; "$HOME/.config/ncmpcpp/coverart/imv_cover_art.zsh" #KEYBOARD mpc next
	bindl = , code:173, exec, mpc prev; "$HOME/.config/ncmpcpp/coverart/imv_cover_art.zsh" #KEYBOARD mpc previous

# hyprlocked functions
	bindl = SHIFT, F5, exec, "$HOME/.config/hypr/scripts/hyprlockfunctions.zsh" "shutdown"
	bindl = SHIFT, F12, exec, "$HOME/.config/hypr/scripts/hyprlockfunctions.zsh" "suspend"

