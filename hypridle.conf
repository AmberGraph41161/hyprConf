$hypridlenofiticationlifetime = 25000
# $hypridlenofiticationid = 121212121
$hypridlenofiticationid = 100000002

general {
	#lock_cmd = notify-send "lock!"          # dbus/sysd lock command (loginctl lock-session)
	#unlock_cmd = notify-send "unlock!"      # same as above, but unlock
	#on_lock_cmd = ""
	#on_unlock_cmd = ""
	#before_sleep_cmd = notify-send "Zzz"    # command ran before sleep
	#after_sleep_cmd = notify-send "Awake!"  # command ran after sleep
	ignore_dbus_inhibit = false              # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
	#ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors
	#inhibit_sleep = 2
		#The general:inhibit_sleep option is used to make sure hypridle can do certain tasks before the system goes to sleep.
		#Options:
			#3 makes your system wait until the session gets locked by a lock screen app. This works with all wayland session-lock apps.
			#2 (auto) selects either 3 or 1 depending on whether hypridle detects if you want to launch hyprlock before sleep.
			#1 makes the system wait until hypridle launched general:before_sleep_cmd.
			#0 disables sleep inhibition.
}

#warn that ima go dim my screen and sleep soon
listener {
	timeout = 600 #10 minutes
	on-timeout = notify-send "HYPRIDLE" "You are now AFK\nDimming in 5 minutes\nDPMS off in 10 minutes\nSleep in 15 minutes" -u critical -r $hypridlenofiticationid
	#on-resume = notify-send "HYPRIDLE" "Welcome back!" -u normal -t $hypridlenofiticationlifetime -r $hypridlenofiticationid
}

#dim screen
listener {
	timeout = 900 #15 minutes
	on-timeout = brightnessctl -s && brightnessctl s 30%-
	on-resume = brightnessctl -r
}

#lock screens
listener {
	timeout = 1200 #20 minutes
	on-timeout = pidof hyprlock || hyprlock --immediate --no-fade-in
	#on-resume =
}

#turn off screens (DPMS on)
listener {
	timeout = 1205 #20 minutes and 5 seconds
	on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = off })'
	on-resume = hyprctl dispatch  'hl.dsp.dpms({ action = on })'
}

#go to sleepy sleepy
listener {
	timeout = 1500 #25 minutes
	on-timeout = systemctl suspend #go to sleepy, bye bye!
	#on-resume =
}
