### PASSWORD FIELD ###
input-field {
	monitor =
	size = 300, 50
	outline_thickness = 3
	dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
	dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
	dots_center = false
	dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
	#dots_text_format = "*"
	outer_color = rgb(151515)
	inner_color = rgb(200, 200, 200)
	font_color = rgb(10, 10, 10)
	font_family = "Noto Sans"
	fade_on_empty = true
	fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
	placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
	hide_input = false
	hide_input_base_color = rgb(153, 170, 187)
	rounding = -1 # -1 means complete rounding (circle/oval)
	check_color = rgb(204, 136, 34)
	fail_color = rgb(204, 34, 34) # if authentication failed, changes outer_color and fail message color
	fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
	#fail_transition = 300 # transition time in ms between normal outer_color and fail_color ########################## deprecated as of idk, but found out rn as of Friday, August 01, 2025, 17:09:56
	capslock_color = rgb(223, 23, 123)
	numlock_color = -1
	bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
	invert_numlock = false # change color if numlock is off
	swap_font_color = false # see below

	position = 0, -20
	halign = center
	valign = center
	zindex = 0
}

### DATE AND TIME AT THE BOTTOM RIGHT OF THE SCREEN ###
label {
	monitor =
	text = cmd[update:1000] date
	color = rgba(200, 200, 200, 1.0)
	font_size = 20
	font_family = Hack Nerd Font Mono
	rotate = 0
	position = 0, 0 
	halign = right
	valign = bottom
	shadow_passes = 1
	shadow_size = 2
	shadow_boost = 1.2
	shadow_color = rgb(0, 0, 0)
}

### BATTERY PERCENTAGE ON THE TOP RIGHT OF THE SCREEN ###
label {
	monitor =
	text = cmd[update:10000] acpi -b
	color = rgba(200, 200, 200, 1.0)
	font_size = 20
	font_family = Hack Nerd font Mono
	rotate = 0
	position = 0, 0
	halign = right
	valign = top
	shadow_passes = 1
	shadow_size = 2
	shadow_boost = 1.2
	shadow_color = rgb(0, 0, 0)
}

### LOCK KEYBINDS ON TOP LEFT OF SCREEN
label {
	monitor =
	text = SHIFT+F5 to shutdown, SHIFT+F12 to suspend
	color = rgba(200, 200, 200, 1.0)
	font_size = 20
	font_family = Hack Nerd font Mono
	rotate = 0
	position = 0, 0
	halign = left
	valign = top
	shadow_passes = 1
	shadow_size = 2
	shadow_boost = 1.2
	shadow_color = rgb(0, 0, 0)
}
