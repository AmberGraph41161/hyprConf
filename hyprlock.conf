#vars
#	$USER - username (e.g. linux-user)
#	$DESC - user description (e.g. Linux User)
#	$TIME - current time in 24-hour format (e.g. 13:37)
#	$TIME12 - current time in 12-hour format (e.g. 1:37 PM)
#	$LAYOUT - current keyboard layout
#	$ATTEMPTS - failed authentication attempts
#	$FAIL - last authentication fail reason
#	$PAMPROMPT - pam auth last prompt
#	$PAMFAIL - pam auth last fail reason
#	$FPRINTPROMPT - fingerprint auth last prompt
#	$FPRINTFAIL - fingerprint auth last fail reason

### GENERAL CONF ###
general {
	hide_cursor = false
	ignore_empty_input = false
	immediate_render = false
	text_trim = true
	fractional_scaling = 2 # 0 - disabled, 1 - enabled, 2 - auto
	screencopy_mode = 0 # 0 - gpu accelerated, 1 - cpu based (slow)
	fail_timeout = 2000
}

auth {
	pam:enabled = true
	pam:module = hyprlock
	fingerprint:enabled = false
	fingerprint:ready_message = "(Scan fingerprint to unlock)"
	fingerprint:present_message	 = "Scanning fingerprint"
	fingerprint:retry_delay = 250
}

animations {
	enabled = true
}

### BACKGROUND AND PFP ###
background {
	monitor = # leaving blank seems to cover all monitors...
	path = $HOME/.config/hypr/resources/currentwallpaper
	color = rgba(0, 0, 0, 0.8)
	blur_passes = 1 # 0 disables blurring
	blur_size = 7
	noise = 0.0117
	contrast = 0.8916
	brightness = 0.8172
	vibrancy = 0.1696
	vibrancy_darkness = 0.0

	reload_time = -1
	#reload_cmd = ""
	crossfade_time = -1.0
	zindex = -1
}

image {
	monitor =
	path = $HOME/.config/hypr/resources/hyprlockpfp.png
	size = 150 # lesser side if not 1:1 ratio
	rounding = -1 # negative values mean circle
	border_size = 4
	border_color = rgb(221, 221, 221)
	rotate = 0 # degrees, counter-clockwise
	reload_time = -1 # seconds between reloading, 0 to reload with SIGUSR2
	reload_cmd =  # command to get new path. if empty, old path will be used. don't run "follow" commands like tail -F

	position = 0, 130
	halign = center
	valign = center
	zindex = 0
}

